<!doctype html><html><head><meta charset='utf-8'><title>Calculator Pro</title><style>body{font-family:Segoe UI;background:#0f1220;color:#fff;margin:0;padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button,input{font:inherit;padding:10px;border-radius:8px;border:1px solid #3b4260;background:#1a2033;color:#fff}#display{width:100%;margin-bottom:10px;text-align:right;font-size:1.2rem}.row{display:flex;gap:8px;flex-wrap:wrap}ul{max-height:170px;overflow:auto}</style></head><body><h2>Calculator Pro</h2><input id='display' value='0' readonly><div class='grid' id='pad'></div><div class='row' style='margin-top:10px'><button onclick='memStore()'>MS</button><button onclick='memRecall()'>MR</button><button onclick='clearHistory()'>Clear History</button><strong id='mem'>Memory: 0</strong></div><h3>History</h3><ul id='hist'></ul><script>const keys=['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','(',')','C','←'];let exp='';let memory=Number(localStorage.getItem('gerbera_calc_mem')||0);mem.textContent='Memory: '+memory;keys.forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>press(k);pad.appendChild(b)});function press(k){if(k==='C'){exp='';display.value='0';return;}if(k==='←'){exp=exp.slice(0,-1);display.value=exp||'0';return;}if(k==='='){try{const r=Function('return ('+exp+')')();addHistory(exp,r);display.value=r;exp=String(r);}catch{display.value='Error';}return;}exp+=k;display.value=exp;}function addHistory(e,r){const arr=JSON.parse(localStorage.getItem('gerbera_calc_hist')||'[]');arr.unshift(`${e} = ${r}`);localStorage.setItem('gerbera_calc_hist',JSON.stringify(arr.slice(0,30)));renderHist();}function renderHist(){const arr=JSON.parse(localStorage.getItem('gerbera_calc_hist')||'[]');hist.innerHTML=arr.map(x=>`<li>${x}</li>`).join('');}function memStore(){memory=Number(display.value)||0;localStorage.setItem('gerbera_calc_mem',memory);mem.textContent='Memory: '+memory;}function memRecall(){exp+=String(memory);display.value=exp;}function clearHistory(){localStorage.removeItem('gerbera_calc_hist');renderHist();}renderHist();</script></body></html>
