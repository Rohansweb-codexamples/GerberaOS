<!doctype html><html><head><meta charset='utf-8'><title>Calculator</title><style>body{font-family:Segoe UI;padding:16px;background:#0f1220;color:#fff}input,button{font:inherit;padding:8px;margin:4px}</style></head><body><h1>Calculator.exe</h1><input id='a' type='number'><input id='b' type='number'><br><button onclick='op("+")'>+</button><button onclick='op("-")'>-</button><button onclick='op("*")'>×</button><button onclick='op("/")'>÷</button><h2 id='r'>Result: 0</h2><script>function op(s){const x=+a.value,y=+b.value;let z=0;if(s=='+')z=x+y;if(s=='-')z=x-y;if(s=='*')z=x*y;if(s=='/')z=y?x/y:'∞';r.textContent='Result: '+z}</script></body></html>
