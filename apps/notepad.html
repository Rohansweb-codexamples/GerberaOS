<!doctype html><html><head><meta charset='utf-8'><title>Notepad Pro</title><style>body{font-family:Segoe UI;margin:0;background:#10131c;color:#eef;padding:14px}.top{display:flex;gap:8px;flex-wrap:wrap}textarea{width:100%;height:65vh;margin-top:10px;background:#191f2e;color:#fff;border:1px solid #3a4664;border-radius:8px;padding:10px}input,button{font:inherit;padding:8px;border-radius:8px;border:1px solid #3a4664;background:#1b2233;color:#fff}button{cursor:pointer}.muted{color:#b9c1d9;font-size:.9rem}</style></head><body><h2>Notepad Pro</h2><div class='top'><input id='title' placeholder='Note title'><button onclick='save()'>Save</button><button onclick='load()'>Load</button><button onclick='exportTxt()'>Export .txt</button><input id='find' placeholder='Find text' oninput='highlight()'></div><p class='muted' id='status'>Ready.</p><textarea id='txt' placeholder='Write here...'></textarea><script>const KEY='gerbera_notepad_pro';function save(){localStorage.setItem(KEY,JSON.stringify({title:title.value,body:txt.value,time:new Date().toISOString()}));status.textContent='Saved '+new Date().toLocaleTimeString();}function load(){const d=JSON.parse(localStorage.getItem(KEY)||'{}');title.value=d.title||'';txt.value=d.body||'';status.textContent=d.time?'Loaded '+new Date(d.time).toLocaleString():'No saved note';}function exportTxt(){const blob=new Blob([txt.value],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(title.value||'note')+'.txt';a.click();}function highlight(){const q=find.value.trim();if(!q){status.textContent='Ready.';return;}const count=(txt.value.match(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'))||[]).length;status.textContent=`Found ${count} match(es)`;}load();</script></body></html>
