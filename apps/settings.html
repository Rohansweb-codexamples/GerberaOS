<!doctype html><html><head><meta charset='utf-8'><title>Settings Center</title><style>body{font-family:Segoe UI;background:#101827;color:#fff;margin:0;padding:14px}label{display:block;margin-top:10px}input,select,button{font:inherit;padding:8px;border-radius:8px;border:1px solid #3a4a6f;background:#192640;color:#fff}button{margin-top:10px}.ok{color:#9dffbc}</style></head><body><h2>Settings Center</h2><label>Display Name<input id='dn'></label><label>Accent Mood<select id='mood'><option value='sunset'>Sunset</option><option value='rose'>Rose</option><option value='gold'>Gold</option></select></label><label>Startup App<select id='startup'><option>apps/notepad.html</option><option>apps/files.html</option><option>apps/browser.html</option><option>apps/music.html</option></select></label><button onclick='save()'>Save Settings</button><p id='msg' class='ok'></p><script>dn.value=localStorage.getItem('gerbera_display_name')||'';mood.value=localStorage.getItem('gerbera_mood')||'sunset';startup.value=localStorage.getItem('gerbera_startup_app')||'apps/notepad.html';function save(){localStorage.setItem('gerbera_display_name',dn.value.trim());localStorage.setItem('gerbera_mood',mood.value);localStorage.setItem('gerbera_startup_app',startup.value);msg.textContent='Settings saved.';}</script></body></html>
