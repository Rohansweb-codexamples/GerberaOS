<!doctype html><html><head><meta charset='utf-8'><title>Browser</title></head><body style='font-family:Segoe UI;padding:16px;background:#101014;color:#fff'><h1>Browser.exe</h1><p>Type a full URL (https://...)</p><input id='u' style='width:70%'><button onclick='go()'>Open</button><script>function go(){const x=u.value.trim();if(!x.startsWith('http'))return alert('Use full URL');window.open(x,'_blank','noopener');}</script></body></html>
