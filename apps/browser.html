<!doctype html><html><head><meta charset='utf-8'><title>Browser Hub</title><style>body{font-family:Segoe UI;background:#0f1117;color:#fff;margin:0;padding:14px}input,button{font:inherit;padding:8px;border-radius:8px;border:1px solid #3a435f;background:#1b2437;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}ul{padding-left:18px}</style></head><body><h2>Browser Hub</h2><div class='row'><input id='url' placeholder='https://example.com' style='flex:1'><button onclick='openUrl()'>Open</button><button onclick='saveBm()'>Save Bookmark</button></div><h3>Bookmarks</h3><ul id='bm'></ul><script>const KEY='gerbera_bookmarks';function openUrl(v=url.value){const u=(v||'').trim();if(!/^https?:\/\//.test(u))return alert('Use full http/https URL');window.open(u,'_blank','noopener')}function saveBm(){const u=url.value.trim();if(!u)return;const arr=JSON.parse(localStorage.getItem(KEY)||'[]');if(!arr.includes(u))arr.push(u);localStorage.setItem(KEY,JSON.stringify(arr));render()}function del(i){const arr=JSON.parse(localStorage.getItem(KEY)||'[]');arr.splice(i,1);localStorage.setItem(KEY,JSON.stringify(arr));render()}function render(){const arr=JSON.parse(localStorage.getItem(KEY)||'[]');bm.innerHTML=arr.map((u,i)=>`<li><a href='#' onclick='openUrl("${u}")'>${u}</a> <button onclick='del(${i})'>x</button></li>`).join('')}render();</script></body></html>
