<!doctype html><html><head><meta charset='utf-8'><title>Paint Studio</title><style>body{font-family:Segoe UI;background:#151515;color:#fff;margin:0;padding:14px}canvas{background:#fff;border:1px solid #666;border-radius:8px;touch-action:none}input,button{font:inherit;padding:8px;margin-right:6px;border-radius:8px;border:1px solid #555;background:#202020;color:#fff}</style></head><body><h2>Paint Studio</h2><div><input type='color' id='color' value='#111111'><input type='range' id='size' min='1' max='40' value='4'><button onclick='clearCanvas()'>Clear</button><button onclick='undo()'>Undo</button><button onclick='savePng()'>Export PNG</button></div><canvas id='cv' width='1000' height='520'></canvas><script>const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let draw=false,stack=[];function snap(){stack.push(cv.toDataURL());if(stack.length>20)stack.shift()}cv.addEventListener('pointerdown',e=>{draw=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);snap()});cv.addEventListener('pointermove',e=>{if(!draw)return;ctx.lineWidth=size.value;ctx.strokeStyle=color.value;ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()});window.addEventListener('pointerup',()=>draw=false);function clearCanvas(){snap();ctx.clearRect(0,0,cv.width,cv.height);}function undo(){const last=stack.pop();if(!last)return;const img=new Image();img.onload=()=>{ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0)};img.src=last;}function savePng(){const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='gerbera-paint.png';a.click();}</script></body></html>
