<!doctype html><html><head><meta charset='utf-8'><title>Paint</title><style>body{font-family:Segoe UI;padding:16px;background:#161616;color:#fff}canvas{border:1px solid #777;background:#fff}button{margin-top:8px}</style></head><body><h1>Paint.exe</h1><canvas id='c' width='900' height='480'></canvas><br><button onclick='ctx.clearRect(0,0,c.width,c.height)'>Clear</button><button onclick='download()'>Export PNG</button><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let d=false;c.onmousedown=e=>{d=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)};c.onmousemove=e=>{if(!d)return;ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()};window.onmouseup=()=>d=false;function download(){const a=document.createElement('a');a.href=c.toDataURL();a.download='gerbera-paint.png';a.click();}</script></body></html>
