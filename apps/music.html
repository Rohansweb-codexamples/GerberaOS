<!doctype html><html><head><meta charset='utf-8'><title>Music Deck</title><style>body{font-family:Segoe UI;background:#0c1018;color:#fff;margin:0;padding:14px}input,button{font:inherit;padding:8px;border-radius:8px;border:1px solid #3a4260;background:#1b2233;color:#fff}ul{max-height:180px;overflow:auto}canvas{width:100%;height:90px;background:#0a0d14;border:1px solid #2a3248;border-radius:8px}</style></head><body><h2>Music Deck</h2><input id='picker' type='file' accept='audio/*' multiple><audio id='player' controls style='width:100%;margin-top:8px'></audio><div style='margin-top:8px'><button onclick='prev()'>Prev</button><button onclick='next()'>Next</button><button onclick='shuffle()'>Shuffle</button></div><canvas id='viz' width='900' height='90'></canvas><h3>Playlist</h3><ul id='list'></ul><script>let tracks=[],i=0;picker.onchange=()=>{tracks=[...picker.files].map(f=>({name:f.name,url:URL.createObjectURL(f)}));i=0;render();play()};function render(){list.innerHTML=tracks.map((t,idx)=>`<li><button onclick='go(${idx})'>${idx===i?'▶ ':''}${t.name}</button></li>`).join('')}function play(){if(!tracks[i])return;player.src=tracks[i].url;player.play();render()}function go(n){i=n;play()}function next(){if(!tracks.length)return;i=(i+1)%tracks.length;play()}function prev(){if(!tracks.length)return;i=(i-1+tracks.length)%tracks.length;play()}function shuffle(){tracks.sort(()=>Math.random()-0.5);i=0;play()}player.onended=next;const c=viz,ctx=c.getContext('2d');setInterval(()=>{ctx.clearRect(0,0,c.width,c.height);for(let x=0;x<c.width;x+=14){const h=(Math.sin((Date.now()/220)+(x/22))+1)*30+(player.paused?4:18);ctx.fillStyle='#ff6ba8';ctx.fillRect(x,c.height-h,10,h)}},50);</script></body></html>
