<!doctype html><html><head><meta charset='utf-8'><title>App Store</title><style>body{font-family:Segoe UI;background:#121020;color:#fff;margin:0;padding:14px}.app{border:1px solid #3b3556;border-radius:10px;padding:10px;margin:8px 0;background:#1a1730}button{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid #4e4674;background:#2a2550;color:#fff}</style></head><body><h2>Gerbera App Store</h2><p>Enable packs for your profile.</p><div id='apps'></div><script>const PACKS=[['Office Pack','Docs, Slides, Sheets'],['Creative Pack','Designer, Studio Brushes, PhotoFX'],['Developer Pack','CodePad, JSON Lab, API Client']];const KEY='gerbera_store_packs';function get(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function save(v){localStorage.setItem(KEY,JSON.stringify(v))}function toggle(name){const s=new Set(get());s.has(name)?s.delete(name):s.add(name);save([...s]);render()}function render(){const enabled=new Set(get());apps.innerHTML=PACKS.map(([n,d])=>`<div class='app'><strong>${n}</strong><p>${d}</p><button onclick='toggle("${n}")'>${enabled.has(n)?'Uninstall':'Install'}</button></div>`).join('')}render();</script></body></html>
