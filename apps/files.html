<!doctype html><html><head><meta charset='utf-8'><title>Files Explorer</title><style>body{font-family:Segoe UI;background:#101214;color:#f1f4ff;margin:0;padding:14px}input,button,select{font:inherit;padding:7px;border-radius:8px;border:1px solid #404858;background:#1a202d;color:#fff}table{width:100%;border-collapse:collapse;margin-top:10px}td,th{border-bottom:1px solid #2e3446;padding:8px;text-align:left}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><h2>Files Explorer</h2><div class='row'><input id='name' placeholder='File name'><select id='type'><option>doc</option><option>img</option><option>code</option><option>misc</option></select><input id='tag' placeholder='Tag'><button onclick='add()'>Add</button><button onclick='backup()'>Export JSON</button><input type='file' id='restore' accept='application/json'></div><table><thead><tr><th>Name</th><th>Type</th><th>Tag</th><th>Actions</th></tr></thead><tbody id='rows'></tbody></table><script>const KEY='gerbera_files_v2';function get(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function set(v){localStorage.setItem(KEY,JSON.stringify(v))}function render(){rows.innerHTML=get().map((f,i)=>`<tr><td contenteditable onblur="edit(${i},'name',this.textContent)">${f.name}</td><td>${f.type}</td><td contenteditable onblur="edit(${i},'tag',this.textContent)">${f.tag||''}</td><td><button onclick='del(${i})'>Delete</button></td></tr>`).join('')}function add(){if(!name.value.trim())return;const arr=get();arr.push({name:name.value.trim(),type:type.value,tag:tag.value.trim()});set(arr);name.value='';tag.value='';render()}function del(i){const arr=get();arr.splice(i,1);set(arr);render()}function edit(i,k,v){const arr=get();arr[i][k]=v.trim();set(arr)}function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(get(),null,2)],{type:'application/json'}));a.download='gerbera-files.json';a.click()}restore.onchange=()=>{const f=restore.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{set(JSON.parse(r.result));render()}catch{alert('Invalid JSON')}};r.readAsText(f)};render();</script></body></html>
