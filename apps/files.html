<!doctype html><html><head><meta charset='utf-8'><title>Files</title><style>body{font-family:Segoe UI;padding:16px;background:#121212;color:#eee}li{margin:6px 0}</style></head><body><h1>Files.exe</h1><input id='f' placeholder='New file name'><button onclick='add()'>Add</button><ul id='list'></ul><script>const key='gerbera_files';function render(){const arr=JSON.parse(localStorage.getItem(key)||'[]');list.innerHTML=arr.map((x,i)=>`<li>${x} <button onclick="del(${i})">Delete</button></li>`).join('')}function add(){const v=f.value.trim();if(!v)return;const arr=JSON.parse(localStorage.getItem(key)||'[]');arr.push(v);localStorage.setItem(key,JSON.stringify(arr));f.value='';render()}function del(i){const arr=JSON.parse(localStorage.getItem(key)||'[]');arr.splice(i,1);localStorage.setItem(key,JSON.stringify(arr));render()}render();</script></body></html>
