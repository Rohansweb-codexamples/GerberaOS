<!doctype html><html><head><meta charset='utf-8'><title>Photos Gallery</title><style>body{font-family:Segoe UI;background:#10121a;color:#fff;margin:0;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.card{border:1px solid #34405d;border-radius:8px;padding:6px;background:#1a2233}img{width:100%;height:110px;object-fit:cover;border-radius:6px}</style></head><body><h2>Photos Gallery</h2><input type='file' id='pick' accept='image/*' multiple><p id='meta'></p><div class='grid' id='grid'></div><script>pick.onchange=()=>{const files=[...pick.files];meta.textContent=`${files.length} image(s) selected`;grid.innerHTML='';files.forEach(f=>{const u=URL.createObjectURL(f);const c=document.createElement('div');c.className='card';c.innerHTML=`<img src='${u}'><div>${f.name}</div><small>${Math.round(f.size/1024)} KB</small>`;grid.appendChild(c);});};</script></body></html>
