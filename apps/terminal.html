<!doctype html><html><head><meta charset='utf-8'><title>Terminal X</title><style>body{font-family:Consolas,monospace;background:#000;color:#24f46e;margin:0;padding:14px}#out{height:70vh;overflow:auto;border:1px solid #203525;padding:8px;background:#020402}input{width:100%;margin-top:8px;padding:8px;background:#071107;border:1px solid #26432a;color:#24f46e}</style></head><body><h2 style='font-family:Segoe UI;color:#fff'>Terminal X</h2><div id='out'></div><input id='cmd' placeholder='help'><script>const hist=[];let h=-1;const o=t=>out.innerHTML+=`<div>${t}</div>`;o('Gerbera Terminal X ready.');const run=s=>{const [c,...a]=s.split(' ');if(c==='help')o('commands: help, date, echo, clear, apps, whoami, history');else if(c==='date')o(new Date().toString());else if(c==='echo')o(a.join(' '));else if(c==='clear')out.innerHTML='';else if(c==='apps')o('Notepad Pro, Calculator Pro, Paint Studio, Files Explorer, Music Deck, Photos Gallery, Browser Hub, Terminal X, App Store, Settings Center');else if(c==='whoami')o(localStorage.getItem('gerbera_display_name')||'Gerbera User');else if(c==='history')hist.forEach((x,i)=>o(`${i+1}: ${x}`));else o('unknown command');};cmd.addEventListener('keydown',e=>{if(e.key==='Enter'){const s=cmd.value.trim();if(!s)return;o('$ '+s);hist.push(s);h=hist.length;run(s);cmd.value='';out.scrollTop=out.scrollHeight;}if(e.key==='ArrowUp'){h=Math.max(0,h-1);cmd.value=hist[h]||'';}if(e.key==='ArrowDown'){h=Math.min(hist.length,h+1);cmd.value=hist[h]||'';}});</script></body></html>
