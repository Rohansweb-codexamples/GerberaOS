<!doctype html><html><head><meta charset='utf-8'><title>Terminal</title></head><body style='font-family:Consolas,monospace;padding:16px;background:#000;color:#0f0'><h1 style='color:#fff;font-family:Segoe UI'>Terminal</h1><div id='o'>$ help</div><input id='i' style='width:100%;margin-top:8px;background:#111;color:#0f0;border:1px solid #333'><script>const cmds={help:'help, date, echo <text>, clear',date:()=>new Date().toString()};i.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const v=i.value.trim();let out='unknown command';if(v==='clear'){o.innerHTML='';i.value='';return;}if(v==='help')out=cmds.help;else if(v==='date')out=cmds.date();else if(v.startsWith('echo '))out=v.slice(5);o.innerHTML+=`<div>$ ${v}</div><div>${out}</div>`;i.value='';});</script></body></html>
